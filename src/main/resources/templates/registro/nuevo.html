<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentosLogin :: head}">
        <title>[[#{registro.titulo}]]</title>
        <meta charset="UTF-8"/>
    </head>
    <body>
        <header th:replace="~{general/fragmentosLogin :: header}"/>

        <main>
            <div class="container-fluid">
                
                <div class="row" style="min-height: 704px;">

                    <div class="col-md-6 bg-dark d-flex align-items-center justify-content-center">
                        <div class="text-center">
                            <img src="/img/logo.png" alt="Consultorio Logo" style="max-width: 600px; width: 90%;"/>
                        </div>
                    </div>

                    <div class="col-md-6 bg-white d-flex align-items-center justify-content-center">
                        <div style ="width: 100%; max-width: 600px; padding: 20px;">
                            <div class="card border border-warning">
                                <div class= "card-header bg-dark text-white text-center">
                                    <h1 class="mb-0">[[#{registro.h1}]]</h1>
                                </div>

                                <div class="card-body p-4">
                                    <form method="POST" th:action="@{/registro/crearUsuario}">

                                        <div class="form-group mb-3">
                                            <label class="mb-2" for="username"><i class="fas fa-user"></i> [[#{formulario.registo.nombre.usuario}]]</label>
                                            <input class="form-control"  type="text" name="username" id="username" required minlength="4" maxlength="30"/>
                                        </div>

                                        <div class="form-group mb-3">
                                            <label class="mb-2" for="nombre"><i class="fas fa-id-card"></i> [[#{formulario.registo.nombre}]]</label>
                                            <input class="form-control" type="text" name="nombre" id="nombre" required maxlength="50"/>
                                        </div>
                                        

                                        <div class="form-group mb-3">
                                            <label class="mb-2" for="apellido1"><i class="fas fa-id-card"></i> [[#{formulario.registo.apellido1}]]</label>
                                            <input class="form-control" type="text" name="apellido1" id="apellido1" 
                                                   required maxlength="30"/>
                                        </div>

                                        <div class="form-group mb-3">
                                            <label class="mb-2" for="apellido2"><i class="fas fa-id-card"></i> [[#{formulario.registo.apellido2}]] </label>
                                            <input class="form-control" type="text" name="apellido2" id="apellido2" maxlength="30"/>
                                        </div>

                                        <div class="form-group mb-3">
                                            
                                            <label class="mb-2" for="correo"><i class="fas fa-envelope"></i> [[#{formulario.registo.correo}]]</label>
                                            <input class="form-control" type="email"  name="correo" id="correo" 
                                                   required maxlength="75"/>
                                        </div>

                                        <div class="form-group mb-3">
                                            <label class="mb-2" for="telefono"> <i class="fas fa-phone"></i> [[#{formulario.registo.telefono}]]</label>
                                            <input class="form-control" type="tel" name="telefono" id="telefono" maxlength="25"/>
                                        </div>

                                        <div class="form-group mb-3">
                                            <label class="mb-2" for="fechaNacimiento"> <i class="fas fa-calendar"></i> [[#{formulario.registo.fecha.nacimiento}]]
                                            </label>
                                            <input class="form-control" type="date" name="fechaNacimiento" id="fechaNacimiento" required/>
                                        </div>

                                        <div class="alert alert-warning">
                                            
                                            <i class="fas fa-info-circle"></i><strong>[[#{atencion}]]:</strong>[[#{registro.mensaje.nota.activacion}]]
                                        </div>

                                        <div class="text-center my-3">
                                            <button class="btn btn-secondary w-100"  type="submit"><i class="fas fa-user-plus"></i> [[#{formulario.registo.btn.registrarse}]]</button></div>

                                        <hr class="my-3"/>

                                        <div class="text-center">
                                            <span class ="text-muted">[[#{formulario.registo.pregunta}]]</span>
                                            <a th:href="@{/login}"  class="text-warning fw-bold" > [[#{formulario.registo.iniciar.sesion}]]</a>
                                        </div>
                                        
                                        
                                    </form>

                                    <div th:if="${error != null}" class="alert alert-danger mt-3"> <i class="fas fa-exclamation-circle"></i> [[${error}]]</div>

                                    <div th:if="${mensaje != null}" class="alert alert-success mt-3"> <i class="fas fa-check-circle"></i> [[${mensaje}]]</div>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{general/fragmentosLogin :: footer}"/>
    </body>
</html>
